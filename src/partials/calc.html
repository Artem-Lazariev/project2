<section class="calc" data-category="numerical">
    <div class="container calc__box">
        <h2 data-aos="fade-down"  class="calc__title">Калькулятор</h2>
        <div class="calc__div">
        <input data-aos="flip-right" id="num1" class="calc__number" placeholder="Введіть число" type="number">
        <ul data-aos="flip-up" class="calc__list">
            <li class="calc__item"><button id="plus" type="button" class="calc__operation">+</button></li>
            <li class="calc__item"><button id="umltiplate" type="button" class="calc__operation">*</button></li>
            <li class="calc__item"><button id="minus" type="button" class="calc__operation">-</button></li>
            <li class="calc__item"><button id="divadet" type="button" class="calc__operation">/</button></li>
        </ul>
        <input data-aos="flip-left" id="num2" class="calc__number" placeholder="Введіть число" type="number">
        <button data-aos="flip-down" id="res" type="button" class="calc__operation">=</button>
        <p data-aos="zoom-in" class="calc__result">Результат</p>
        </div>
    </div>
</section>
